<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site.name }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}" />
    <link rel="canonical" href="{{ site.base_url }}{{ path }}" />
    {% if page is defined and page.preview %}<meta name="robots" content="noindex" />{% endif %}
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.base_url }}{{ path }}" />
    <meta property="og:title" content="{{ self.title() }}" />
    <meta property="og:description" content="{{ self.description() }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0c0c0e" />
    <link rel="icon" href="/static/favicon.svg?v={{ asset_version }}" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/site.css?v={{ asset_version }}" />
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <div class="wrap">
      <header>
        <a class="brand" href="/">context<span>kit</span>{% block brand_suffix %}{% endblock %}</a>
        <nav>
          {% set section = path.split("/")[1] %}
          <a href="/docs/"{% if section == "docs" %} class="active" aria-current="page"{% endif %}>Docs</a>
          <a href="/changelog/"{% if section == "changelog" %} class="active" aria-current="page"{% endif %}>Changelog</a>
          <a href="{{ library.pypi_url }}">PyPI</a>
          <a href="https://github.com/{{ site.repo }}">GitHub</a>
        </nav>
      </header>
      {% block main %}{% endblock %}
      <footer>
        <div>
          <a href="/docs/">Docs</a>
          <a href="/changelog/">Changelog</a>
          <a href="{{ library.pypi_url }}">PyPI</a>
          <a href="{{ sdk.pypi_url }}">Cloud SDK</a>
          <a href="/release.json">release.json</a>
          <a href="https://github.com/{{ site.repo }}">GitHub</a>
        </div>
        <div>ContextKit by Outhad · {{ site.license }} License</div>
      </footer>
    </div>
    <script src="/static/site.js?v={{ asset_version }}" defer></script>
  </body>
</html>
