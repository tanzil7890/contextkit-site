name: Build and deploy

# Builds the site from content/, templates/ and PyPI, and deploys it to GitHub Pages.
#
# - push to main: an edit to the docs, or release notes written by the library's
#   release workflow (content/changelog/<package>/<version>.md).
# - schedule: catches releases published by hand with `twine upload`. It deploys
#   only when PyPI has a version the live site does not show yet.
# - workflow_dispatch / repository_dispatch: rebuild on demand.
# - pull_request: build and check links, without deploying.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Is PyPI ahead of the live site?
        id: check
        if: github.event_name == 'schedule'
        run: python build.py --check-live

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.check.outputs.changed }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check links
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: python build.py

      - uses: actions/upload-pages-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
